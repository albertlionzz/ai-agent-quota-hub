name: Deploy to GitHub Pages

# 只做一件事：把构建好的单文件 HTML 发布成可在线访问的页面。
# 源码在 quota-hub/，产物是仓库根目录那份 HTML——发布时直接拷成 index.html，
# 这样网址是干净的 /ai-agent-quota-hub/，不用带一长串 URL 编码的中文文件名。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新的 push 打断旧的排队（但不打断正在部署的）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    # Pages 站点必须先由仓库管理员开启一次。GITHUB_TOKEN 建不了站点
    # （Create a Pages site 需要 admin 权限，会返回 Resource not accessible by integration），
    # 所以这里只检测、不硬试，未开启时给出明确提示并跳过后续发布，不让流水线红着。
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "Pages 已开启，继续发布。"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages 尚未开启::到 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」并保存，然后重新运行本工作流即可发布。当前 HTTP $code"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 部署前重新构建一次：把刚被 probe 工作流更新的 probe.json 内联进产物。
      # 否则提交的 HTML 里永远是上一轮快照，只有线上 fetch 才能纠正。
      - name: Rebuild（内联最新探活快照）
        run: python quota-hub/build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp "AI-Agent免费额度调度中台.html" "_site/index.html"
          # 保留原文件名入口，方便已经拿到旧链接的人继续用
          cp "AI-Agent免费额度调度中台.html" "_site/quota-hub.html"
          cp "AI-Agent免费额度调研报告.md" "_site/report.md"
          cp README.md "_site/README.md"
          # 探活结果要能被页面 fetch 到同目录的 probe.json；没有就跳过，
          # 页面会退回构建时内联的快照，不至于白屏。
          if [ -f probe.json ]; then cp probe.json "_site/probe.json"; else echo "::notice::还没有 probe.json，跳过"; fi
          # 关掉 Jekyll 处理，避免 _ 开头的路径被吞
          touch _site/.nojekyll
          ls -lh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [preflight, build]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
