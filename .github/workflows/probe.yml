name: probe

# 每 6 小时探一次活，把「哪些端点还通、哪些 base_url 已经 404」写成 probe.json。
# 页面读这个文件显示数据新鲜度——这是本项目从「一份报告」变成「一个工具」的关键一步。
on:
  schedule:
    - cron: '17 */6 * * *'      # 错开整点，避免和一堆定时任务挤在 :00
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'
      - 'quota-hub/probe/**'    # 端点表或探活脚本改了，立刻跑一次验证
      - 'quota-hub/assets/data.js'
      - 'quota-hub/assets/crosscheck.js'
      - 'quota-hub/check-confidence.js'

permissions:
  contents: write               # 需要提交 probe.json
  actions: write                # 提交后要派发一次 Pages 重新发布
  models: read                  # github-models 用 workflow token 就够，不必另配 PAT

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 端点表只有一个真相源（assets/verify.js）。这里先校验 endpoints.json 没漂移，
      # 漂了就说明有人改了 verify.js 忘了重生成——让 CI 红，比让探活测错端点好。
      - name: 校验端点清单与 verify.js 一致
        run: node quota-hub/probe/gen_endpoints.js --check

      # 三方比对已判「口径冲突」的厂商，平台库不能再标 verified（多来源一致）。
      # 数据层一改就跑这个门禁，逼人去裁定，别让两份数据悄悄打架。
      - name: 校验平台库 confidence 与交叉校验结论一致
        run: node quota-hub/check-confidence.js --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 没配 secret 的变量会是空字符串，脚本按「无 key」处理，探到 401 记为「需鉴权」而非失败。
      # 所以零 secret 也能跑，验的是路对不对，不是钱够不够。
      - name: 探活
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          SPARK_API_KEY: ${{ secrets.SPARK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python quota-hub/probe/probe.py --out probe.json --timeout 12 --workers 6

      # 同一趟 CI 顺手复核「交叉校验」引用的三个外部来源时间戳。
      # 只抓公开的核实/巡检日期，不解析额度内容——脚本替不了人判断谁说得对。
      # 抓不到会在 JSON 里标 unreachable 并沿用基线，不会让流水线红。
      - name: 复核交叉校验来源时间戳
        run: python quota-hub/probe/sources.py --out crosscheck-sources.json --timeout 12

      # 仓库根那份单文件 HTML 是给用户下载离线用的。只更新 JSON 不重建它，
      # 离线打开看到的永远是上一轮快照。和 pages.yml 用同一个 build.py，
      # 这里再跑一次一起提交，保证「clone 下来双击」与线上是同一份数据。
      - name: 重建离线产物并校验内联快照
        run: |
          python quota-hub/build.py
          python -c "import json,pathlib; r=pathlib.Path('.'); h=list(r.glob('*.html')); assert len(h)==1, 'expected one root HTML'; s=json.loads((r/'crosscheck-sources.json').read_text(encoding='utf-8'))['fetchedAt']; assert s in h[0].read_text(encoding='utf-8'), 'source snapshot not inlined'; print('inline snapshot verified:', s)"

      - name: 提交结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- probe.json crosscheck-sources.json "AI-Agent免费额度调度中台.html"; then
            echo "探活、来源时间戳与离线产物均无变化"
            exit 0
          fi
          git config user.name  "quota-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe.json crosscheck-sources.json "AI-Agent免费额度调度中台.html"
          git commit -m "chore(probe): $(date -u +%Y-%m-%dT%H:%MZ) 探活结果 + 来源时间戳复核"
          git push
          # GITHUB_TOKEN 发起的 push 不会触发其它 workflow（GitHub 的防循环机制），
          # 而 Pages 与本次 probe 并发、跑在提交之前，内联的还是旧快照。
          # 显式派发一次发布，让 pages.yml 重新 build，把刚提交的探活与来源时间戳
          # 真正送进线上产物；否则「每 6 小时复核」只更新了仓库里的 JSON，页面看不到。
          gh workflow run pages.yml --ref main \
            || echo "::warning::Pages 重新发布派发失败，线上快照要等下一次人工 push 才会更新"
